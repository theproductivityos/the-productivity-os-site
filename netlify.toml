[build]
  publish = "."

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/favicon.ico"
  to = "/assets/productivity-os-logo-mark.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/assets/productivity-os-logo-mark.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon-precomposed.png"
  to = "/assets/productivity-os-logo-mark.png"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/site.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"
